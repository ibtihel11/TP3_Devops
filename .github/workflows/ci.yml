name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install -r requirements.txt pylint

      - name: Analyser la qualité du code (Pylint)
        run: pylint main.py test_main.py

  run-test:
    needs: pylint
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest -v --junitxml=report.xml

      - name: Sauvegarder le rapport JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml

  calculate-coverage:
    needs: pylint
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest-cov

      - name: Calculer la couverture
        run: pytest -v --cov=main --cov-report term-missing --cov-report xml:coverage.xml --cov-fail-under=90

      - name: Afficher la couverture dans le résumé
        if: always()
        run: coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Sauvegarder le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml